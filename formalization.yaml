fidelity:
  divergences: 'None known. Each Challenge statement is written with Mathlib''s notions only. l :
    Fin n → ℂ is the family l₁, …, lₙ; hlalg says each exp (l i) is algebraic over ℚ, so each l i
    is a logarithm of an algebraic number (any branch). LinearIndependent ℚ l is Mathlib''s linear
    independence over ℚ. b₀ and b i are algebraic over ℚ and not all zero (hne); the conclusion is
    b₀ + ∑ i, b i * l i ≠ 0. ι indexes the coordinates of ℂⁿ, n = Fintype.card ι; x i : ι → ℂ and
    y j : ι → ℂ are vectors. hxalg and hxind: the d₁ vectors x i have algebraic coordinates and are
    linearly independent over ℚ; hy: the n vectors y j are linearly independent over ℂ. ι₀ : Option
    ι encodes d₀ ∈ {0, 1}: none is d₀ = 0; some k is d₀ = 1 with the algebraic coordinate k (hy₀).
    ι₀.elim 0 (fun _ => 1) is d₀, and hdim is n < d₀ + d₁. hexp says every exp (∑ ν, x i ν * y j ν)
    is algebraic; the conclusion is False. The compared theorems live in the namespace BakerLinearForms
    and the library theorems keep their library names; the statements are the same up to unfolding
    the library''s abbreviations.'
review:
  status: machine-checked; no human expert review of the Lean
  reviewers: []
  notes: 'Checks made: the Prove2Me platform checked and accepted the proofs when they were first
    submitted, and diaz-modulus-lean builds them in CI with leanprover/lean4:v4.35.0 and Mathlib v4.35.0.
    This repository''s CI builds the extract, audits the axioms with #print axioms, and runs the toolchain''s
    lake comparator. No mathematician has reviewed the Lean code, and the Challenge statements have
    not been reviewed against the sources by anyone independent of their authors.'
