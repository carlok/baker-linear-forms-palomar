# formalization.yaml v0.4
version: v0.4
project:
  name: Baker's theorem on linear forms in logarithms, and the Schneider–Lang criterion for ℂ^{d₀}
    × (ℂ^×)^{d₁} with d₀ ≤ 1
  description: 'Baker''s theorem (Baker 1966). If l₁, …, lₙ are logarithms of algebraic numbers, linearly
    independent over ℚ, then 1, l₁, …, lₙ are linearly independent over the algebraic numbers: b₀
    + b₁ l₁ + ⋯ + bₙ lₙ ≠ 0 for algebraic b₀, …, bₙ not all zero. The criterion of Schneider–Lang
    for ℂ^{d₀} × (ℂ^×)^{d₁}, d₀ ≤ 1 (Waldschmidt 2000, Corollary 4.2). Let n = |ι|, let x₁, …, x_{d₁}
    ∈ ℂⁿ have algebraic coordinates and be linearly independent over ℚ, let y₁, …, yₙ be a basis of
    ℂⁿ, and if d₀ = 1 let the k-th coordinates of the yⱼ be algebraic. If n < d₀ + d₁, then the numbers
    exp ⟨xᵢ, yⱼ⟩ are not all algebraic. This repository is a self-contained extract of these theorems
    from the library github.com/carlok/diaz-modulus-lean, which is the canonical home of the proofs.'
  authors:
  - Carlo Perassi
  license: Apache-2.0
  responsible_maintainers:
  - Carlo Perassi
